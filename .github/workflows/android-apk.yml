name: Build Momentum Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "momentum_android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "momentum_android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: momentum_android

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            automake gettext

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.34

      - name: Validate project configuration
        run: |
          test -f main.py || (echo "::error::momentum_android/main.py is missing" && exit 1)
          test -f buildozer.spec || (echo "::error::momentum_android/buildozer.spec is missing" && exit 1)
          grep -q '^\[app\]' buildozer.spec || (echo "::error::buildozer.spec has no [app] section" && exit 1)

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Momentum-Android-debug-APK
          path: momentum_android/bin/*.apk
          if-no-files-found: error
          retention-days: 14
